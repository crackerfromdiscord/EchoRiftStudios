<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - EchoRift Studios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="Images/logo.png" alt="EchoRift Studios Logo" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="developers.html">Developers</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="page-header fade-in">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you. Send us a message below!</p>
  </section>

  <section class="contact-form fade-in visible">
    <form id="contactForm" action="https://formspree.io/f/xnnbvlpy" method="POST">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required
             style="background-color:#2c2c2c; color:#f2f2f2; border:1px solid #444; border-radius:8px; padding:0.8rem;">

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" placeholder="john@example.com" required
             style="background-color:#2c2c2c; color:#f2f2f2; border:1px solid #444; border-radius:8px; padding:0.8rem;">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message..." required
                style="background-color:#2c2c2c; color:#f2f2f2; border:1px solid #444; border-radius:8px; padding:0.8rem;"></textarea>

      <button type="submit"
              style="background-color:#a855f7; color:#fff; border:none; border-radius:8px; padding:0.8rem; cursor:pointer; font-weight:bold;">
        Send Message
      </button>
    </form>
    <p id="formMessage" style="margin-top: 1rem; text-align: center;"></p>
  </section>

  <footer>
    <p>© 2025 EchoRift Studios. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
